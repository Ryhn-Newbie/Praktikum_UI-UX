    <!-- 1. FORM PEMESANAN Iphone (ORDER FORM) -->
    <h2 align="center">Order Form - Product Link Generator</h2>

    <form action="/praktikum02/hasilpemesanan_pemweb.html" method="POST">
        <table width="100%" border="0" cellpadding="8">
            <tr>
                <!-- Kolom Kiri: Upload Gambar Produk -->
                <td width="30%" valign="top" align="center">
                        <figure>
                            <img src="/praktikum02/image.jpg" alt="Lenovo Legion 9i" width="160" height="160"
                                border="1" />
                        </figure>
                </td>

                <!-- Kolom Kanan: Field Input Form -->
                <td width="70%">
                    <table width="100%" border="0" cellpadding="4">
                        <tr>
                            <td width="25%"><label for="title"><strong>Title Here:</strong></label></td>
                            <td width="75%"><input type="text" id="title" name="title" value="Lenovo Legion 9i"
                                    size="45"></td>
                        </tr>
                        <tr>
                            <td valign="top"><label for="description"><strong>Description:</strong></label></td>
                            <td>
                                <textarea id="description" name="description" rows="4" cols="44">Year: 2025
Model: Laptop Gaming
Condition: New</textarea>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="account_number"><strong>Account Number:</strong></label></td>
                            <td><input type="text" id="account_number" name="account_number" value="123-456-789-0"
                                    size="45"></td>
                        </tr>
                        <tr>
                            <td><label for="bank"><strong>Bank:</strong></label></td>
                            <td>
                                <select id="bank" name="bank">
                                    <option value="Bitcoin" selected>Bitcoin</option>
                                    <option value="BNI">Debit</option>
                                    <option value="BCA">Bank Transfer</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="account_holder"><strong>Account Holder:</strong></label></td>
                            <td><input type="text" id="account_holder" name="account_holder" value="Rehan" size="45">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="transaction"><strong>Transaction:</strong></label></td>
                            <td>
                                <select id="transaction" name="transaction">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3" selected>3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <br>
                                <small><em>* If the transaction is for 3 persons, choose 3 from the drop-down
                                        list</em></small>
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" id="send_mobile_check" name="send_mobile_check" checked>
                                <label for="send_mobile_check">Send to Mobile Phone</label><br>

                                <input type="checkbox" id="send_email_check" name="send_email_check" checked>
                                <label for="send_email_check">Send to Email</label>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="mobile_phone"><strong>Send to Mobile Phone:</strong></label></td>
                            <td><input type="text" id="mobile_phone" name="mobile_phone" value="081211232150" size="45">
                            </td>
                        </tr>
                        <tr>
                            <td><label for="email"><strong>Send to Email:</strong></label></td>
                            <td><input type="text" id="email" name="email" value="r3h4n77@gmail.com" size="45">
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <br>
                                <input type="submit" value="Generate Web Link">
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </form>

    <hr size="3" color="black" style="margin: 40px 0;">
